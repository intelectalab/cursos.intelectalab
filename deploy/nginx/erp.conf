# Servidor web de la plataforma en un VPS (Nginx + PHP-FPM).
# Copiar a /etc/nginx/sites-available/erp.conf, reemplazar DOMINIO y enlazar en sites-enabled.
#
# Un solo bloque atiende al dominio central y a todas las academias (*.DOMINIO):
# cada subdominio sirve la aplicación web y envía /api a Laravel, que reconoce a la
# academia por el encabezado Host.

# Todo lo que llegue por HTTP pasa a HTTPS (salvo la comprobación del certificado)
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO *.DOMINIO;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Sin http2 en la línea listen: en Nginx 1.24 esa opción cambia el puerto 443 para todos los sitios del servidor
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name DOMINIO *.DOMINIO;

    # Certificado de DOMINIO y de las academias (comodín por DNS, o uno por academia por HTTP): ver la guía.
    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/erp/frontend/dist;
    index index.html;

    # Los materiales de un curso pesan hasta 50 MB; PHP debe aceptar lo mismo (upload_max_filesize, post_max_size)
    client_max_body_size 64m;

    access_log /var/log/nginx/erp.access.log;
    error_log  /var/log/nginx/erp.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad de la aplicación web. Las de la API las pone Laravel.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # img-src: logos y portadas (misma web) y miniaturas de YouTube; frame-src: los videos de los cursos.
    # Hay que validarla en el servidor con un video y con el editor de páginas antes de dar por buena.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'" always;

    # Archivos de la aplicación con nombre único por versión: el navegador puede guardarlos un año
    # Con `expires` y no con add_header: un add_header dentro de un location hace que se pierdan las
    # cabeceras de seguridad de arriba (Nginx no las hereda si el bloque define alguna)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # La página de entrada no se guarda: así toma la versión nueva tras cada despliegue
    location = /index.html {
        expires -1;
    }

    # Cualquier otra ruta la resuelve la aplicación web
    location / {
        try_files $uri /index.html;
    }

    # API y comprobación de salud: van a Laravel
    location ~ ^/(api|up)(/|$) {
        root /var/www/erp/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/erp/backend/public;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/erp/backend/public/index.php;
        include fastcgi_params;
        # Conserva el subdominio: de ahí sale la academia
        fastcgi_param HTTP_HOST $host;
        fastcgi_read_timeout 60s;
    }

    # Nada de archivos ocultos (.env, .git)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
