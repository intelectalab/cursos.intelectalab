; Proceso de cola: envía los correos en segundo plano.
; Copiar a /etc/supervisor/conf.d/erp-queue.conf y ejecutar: supervisorctl reread && supervisorctl update
[program:erp-queue]
command=php /var/www/erp/backend/artisan queue:work database --sleep=3 --tries=3 --backoff=30 --max-time=3600
directory=/var/www/erp/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/erp/backend/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
