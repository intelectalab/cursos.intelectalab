<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#084586" />
    <title>Sin conexión</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f5f7fb;
        color: #0f172a;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #ffffff;
        border-radius: 24px;
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
      }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: #e8f0fa;
        color: #084586;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { font-size: 18px; margin: 0; }
      p { font-size: 14px; line-height: 1.5; color: #64748b; margin: 8px 0 24px; }
      button {
        height: 40px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #084586;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" /><path d="M8.5 16.43a5 5 0 0 1 7 0" /><path d="M5 12.86a10 10 0 0 1 5.17-2.69" /><path d="M19 12.86a10 10 0 0 0-2-1.43" /><path d="M2 8.82a15 15 0 0 1 4.18-2.65" /><path d="M22 8.82a15 15 0 0 0-11.29-3.76" /><path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>No hay internet en este momento. Revisa tu conexión y vuelve a intentarlo; lo que ya guardaste no se pierde.</p>
      <button type="button" onclick="location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
